<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1140" role="img" aria-labelledby="title desc">
  <title id="title">쿠팡 인증 서명키 악용과 개인정보 접근 흐름</title>
  <desc id="desc">재직 중 인증 시스템과 서명키에 접근한 개발자가 퇴사 뒤 키를 사용해 전자 출입증을 위조하고, 정상 로그인을 우회해 자동화된 정보 조회를 한 흐름입니다.</desc>
  <rect width="720" height="1140" rx="18" fill="#f7f8f4"/>
  <text x="34" y="52" fill="#30352f" font-family="sans-serif" font-size="29" font-weight="700">서명키 악용으로 로그인 우회</text>
  <text x="34" y="86" fill="#676e65" font-family="sans-serif" font-size="19">과기정통부 조사 결과 기준</text>
  <g font-family="sans-serif">
    <rect x="32" y="118" width="656" height="112" rx="14" fill="#fff" stroke="#d9ded1" stroke-width="2"/><circle cx="76" cy="174" r="25" fill="#52643c"/><text x="76" y="182" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">1</text><text x="120" y="165" fill="#30352f" font-size="22" font-weight="700">재직 중 인증 시스템과 서명키에 접근</text><text x="120" y="199" fill="#676e65" font-size="18">전직 개발자는 인증 시스템 설계·개발 담당</text>
    <line x1="360" y1="232" x2="360" y2="250" stroke="#697d4f" stroke-width="3"/><path d="M352 244 L360 254 L368 244" fill="none" stroke="#697d4f" stroke-width="3"/>
    <rect x="32" y="258" width="656" height="112" rx="14" fill="#e5ebdb"/><circle cx="76" cy="314" r="25" fill="#52643c"/><text x="76" y="322" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">2</text><text x="120" y="305" fill="#30352f" font-size="22" font-weight="700">퇴사 후에도 키가 폐기되지 않음</text><text x="120" y="339" fill="#676e65" font-size="18">키 관리·퇴사자 권한 회수 미흡</text>
    <line x1="360" y1="372" x2="360" y2="390" stroke="#697d4f" stroke-width="3"/><path d="M352 384 L360 394 L368 384" fill="none" stroke="#697d4f" stroke-width="3"/>
    <rect x="32" y="398" width="656" height="112" rx="14" fill="#fff" stroke="#d9ded1" stroke-width="2"/><circle cx="76" cy="454" r="25" fill="#52643c"/><text x="76" y="462" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">3</text><text x="120" y="445" fill="#30352f" font-size="22" font-weight="700">전자 출입증 위조, 로그인 우회</text><text x="120" y="479" fill="#676e65" font-size="18">정상 인증 경로 발급 여부 검증이 없음</text>
    <line x1="360" y1="512" x2="360" y2="530" stroke="#697d4f" stroke-width="3"/><path d="M352 524 L360 534 L368 524" fill="none" stroke="#697d4f" stroke-width="3"/>
    <rect x="32" y="538" width="656" height="112" rx="14" fill="#e5ebdb"/><circle cx="76" cy="594" r="25" fill="#52643c"/><text x="76" y="602" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">4</text><text x="120" y="585" fill="#30352f" font-size="22" font-weight="700">자동화 도구로 계정정보 조회</text><text x="120" y="619" fill="#676e65" font-size="18">주요 공격 기간: 2025.04.14–11.08</text>
    <line x1="360" y1="652" x2="360" y2="670" stroke="#697d4f" stroke-width="3"/><path d="M352 664 L360 674 L368 664" fill="none" stroke="#697d4f" stroke-width="3"/>
    <rect x="32" y="678" width="656" height="112" rx="14" fill="#fff" stroke="#d9ded1" stroke-width="2"/><circle cx="76" cy="734" r="25" fill="#52643c"/><text x="76" y="742" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">5</text><text x="120" y="725" fill="#30352f" font-size="22" font-weight="700">이름·이메일, 배송지, 주문정보 노출</text><text x="120" y="759" fill="#676e65" font-size="18">페이지별 접근 횟수는 피해자 수가 아님</text>
    <rect x="32" y="820" width="656" height="172" rx="14" fill="#f3e7e4"/><text x="58" y="860" fill="#a2645a" font-size="21" font-weight="700">수치를 읽을 때 구분</text><text x="58" y="904" fill="#30352f" font-size="20">과기정통부: 이름·이메일 33,673,817건</text><text x="58" y="940" fill="#30352f" font-size="20">개인정보위: 약 3,755만 명</text><text x="58" y="972" fill="#676e65" font-size="17">발표 시점과 집계 대상이 서로 다릅니다.</text>
  </g>
</svg>
