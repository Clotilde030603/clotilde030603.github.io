<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 490" role="img" aria-labelledby="title desc">
  <title id="title">XZ Utils 백도어 발견 과정</title>
  <desc id="desc">SSH 로그인 지연과 valgrind 오류를 조사하고 liblzma의 이상 동작을 확인해 2024년 3월 29일 공개한 과정입니다.</desc>
  <rect width="840" height="490" rx="18" fill="#f7f8f4"/>
  <text x="42" y="52" fill="#30352f" font-family="sans-serif" font-size="25" font-weight="700">이상 징후에서 공개까지</text>
  <g font-family="sans-serif">
    <rect x="62" y="100" width="716" height="78" rx="13" fill="#ffffff" stroke="#d9ded1" stroke-width="2"/>
    <circle cx="100" cy="139" r="22" fill="#52643c"/>
    <text x="100" y="146" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">1</text>
    <text x="138" y="133" fill="#30352f" font-size="18" font-weight="700">SSH 로그인이 평소보다 느리고 CPU 사용량이 높음</text>
    <text x="138" y="158" fill="#676e65" font-size="15">잘못된 사용자 이름으로 실패한 접속에서도 이상이 관찰됨</text>

    <line x1="420" y1="180" x2="420" y2="202" stroke="#697d4f" stroke-width="3"/>
    <path d="M412 196 L420 206 L428 196" fill="none" stroke="#697d4f" stroke-width="3"/>

    <rect x="62" y="210" width="716" height="78" rx="13" fill="#e5ebdb"/>
    <circle cx="100" cy="249" r="22" fill="#52643c"/>
    <text x="100" y="256" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">2</text>
    <text x="138" y="243" fill="#30352f" font-size="18" font-weight="700">성능 분석과 valgrind 오류 조사</text>
    <text x="138" y="268" fill="#676e65" font-size="15">valgrind는 프로그램의 메모리 사용 문제를 확인하는 도구</text>

    <line x1="420" y1="290" x2="420" y2="312" stroke="#697d4f" stroke-width="3"/>
    <path d="M412 306 L420 316 L428 306" fill="none" stroke="#697d4f" stroke-width="3"/>

    <rect x="62" y="320" width="716" height="78" rx="13" fill="#ffffff" stroke="#d9ded1" stroke-width="2"/>
    <circle cx="100" cy="359" r="22" fill="#52643c"/>
    <text x="100" y="366" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">3</text>
    <text x="138" y="353" fill="#30352f" font-size="18" font-weight="700">SSH 경로에서 liblzma의 이상 동작을 추적</text>
    <text x="138" y="378" fill="#676e65" font-size="15">라이브러리와 배포 파일의 변경을 확인</text>

    <line x1="420" y1="400" x2="420" y2="422" stroke="#a2645a" stroke-width="3"/>
    <path d="M412 416 L420 426 L428 416" fill="none" stroke="#a2645a" stroke-width="3"/>

    <rect x="62" y="430" width="716" height="42" rx="13" fill="#f3e7e4"/>
    <text x="84" y="457" fill="#a2645a" font-size="17" font-weight="700">2024년 3월 29일 · oss-security에 백도어 발견 공개</text>
  </g>
</svg>
