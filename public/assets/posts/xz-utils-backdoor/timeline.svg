<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 700" role="img" aria-labelledby="title desc">
  <title id="title">XZ Utils 백도어 공개 기록 타임라인</title>
  <desc id="desc">2021년 공개 기여 시작부터 2024년 3월 백도어 공개까지의 주요 시점. 의도에 대한 평가는 공개 기록을 바탕으로 한 분석입니다.</desc>
  <rect width="840" height="700" rx="18" fill="#f7f8f4"/>
  <text x="42" y="52" fill="#30352f" font-family="sans-serif" font-size="25" font-weight="700">공개 기록으로 본 주요 시점</text>
  <text x="42" y="82" fill="#676e65" font-family="sans-serif" font-size="15">연도별 기록은 기여와 변경 시점을 보여주며, 시작 의도를 확정하지는 않습니다.</text>
  <line x1="82" y1="130" x2="82" y2="632" stroke="#a9b495" stroke-width="4"/>
  <g font-family="sans-serif">
    <circle cx="82" cy="154" r="12" fill="#52643c"/>
    <rect x="116" y="120" width="680" height="72" rx="12" fill="#e5ebdb"/>
    <text x="138" y="150" fill="#52643c" font-size="16" font-weight="700">2021년 10월</text>
    <text x="138" y="174" fill="#30352f" font-size="17">XZ 개발 메일링 리스트에 첫 공개 기여가 기록됨</text>

    <circle cx="82" cy="250" r="12" fill="#52643c"/>
    <rect x="116" y="216" width="680" height="72" rx="12" fill="#ffffff"/>
    <text x="138" y="246" fill="#52643c" font-size="16" font-weight="700">2022년</text>
    <text x="138" y="270" fill="#30352f" font-size="17">유지관리 역할과 권한이 점차 확대된 정황이 공개 기록에 남음</text>

    <circle cx="82" cy="346" r="12" fill="#52643c"/>
    <rect x="116" y="312" width="680" height="72" rx="12" fill="#e5ebdb"/>
    <text x="138" y="342" fill="#52643c" font-size="16" font-weight="700">2023년</text>
    <text x="138" y="366" fill="#30352f" font-size="17">빌드와 테스트 과정에 관련된 코드 변경이 이어짐</text>

    <circle cx="82" cy="442" r="12" fill="#52643c"/>
    <rect x="116" y="408" width="680" height="72" rx="12" fill="#ffffff"/>
    <text x="138" y="438" fill="#52643c" font-size="16" font-weight="700">2024년 2–3월</text>
    <text x="138" y="462" fill="#30352f" font-size="17">5.6.0·5.6.1 배포본에 악성 빌드 경로가 포함됨</text>

    <circle cx="82" cy="538" r="12" fill="#a2645a"/>
    <rect x="116" y="504" width="680" height="72" rx="12" fill="#f3e7e4"/>
    <text x="138" y="534" fill="#a2645a" font-size="16" font-weight="700">2024년 3월 29일</text>
    <text x="138" y="558" fill="#30352f" font-size="17">SSH 동작의 이상 징후를 조사하던 중 백도어가 공개됨</text>
  </g>
  <text x="42" y="646" fill="#676e65" font-family="sans-serif" font-size="13">자료: 공개된 메일링 리스트·커밋과 보안 분석. 계정의 배후나 최초 의도는 확정된 사실과 구분해야 합니다.</text>
</svg>
