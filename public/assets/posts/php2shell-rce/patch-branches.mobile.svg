<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 720" role="img" aria-labelledby="title desc">
  <title id="title">PHP2Shell 브랜치별 수정 버전 확인</title>
  <desc id="desc">PHP 8.2부터 8.5까지의 수정 버전, 오래된 브랜치의 백포트와 지원 종료 확인을 나타냅니다.</desc>
  <rect width="320" height="720" rx="16" fill="#f7f8f4"/>
  <text x="16" y="29" fill="#30352f" font-family="sans-serif" font-size="18" font-weight="700">브랜치별 패치 버전</text>
  <text x="16" y="50" fill="#676e65" font-family="sans-serif" font-size="11">배포판 백포트는 버전 문자열이 다를 수 있음</text>
  <g font-family="sans-serif">
    <rect x="16" y="68" width="288" height="52" rx="9" fill="#e5ebdb"/><text x="28" y="90" fill="#52643c" font-size="13" font-weight="700">PHP 8.5</text><text x="28" y="108" fill="#30352f" font-size="12">수정: 8.5.12 이상</text>
    <rect x="16" y="128" width="288" height="52" rx="9" fill="#fff" stroke="#d9ded1" stroke-width="1.2"/><text x="28" y="150" fill="#52643c" font-size="13" font-weight="700">PHP 8.4</text><text x="28" y="168" fill="#30352f" font-size="12">수정: 8.4.27 이상</text>
    <rect x="16" y="188" width="288" height="52" rx="9" fill="#e5ebdb"/><text x="28" y="210" fill="#52643c" font-size="13" font-weight="700">PHP 8.3</text><text x="28" y="228" fill="#30352f" font-size="12">수정: 8.3.36 이상</text>
    <rect x="16" y="248" width="288" height="52" rx="9" fill="#fff" stroke="#d9ded1" stroke-width="1.2"/><text x="28" y="270" fill="#52643c" font-size="13" font-weight="700">PHP 8.2</text><text x="28" y="288" fill="#30352f" font-size="12">수정: 8.2.35 이상</text>
    <rect x="16" y="316" width="288" height="112" rx="9" fill="#fff" stroke="#d9ded1" stroke-width="1.2"/><text x="28" y="342" fill="#a2645a" font-size="13" font-weight="700">PHP 7.4 · 8.0 · 8.1</text><text x="28" y="368" fill="#30352f" font-size="11">소스 백포트 제공. 공급자 패키지</text><text x="28" y="386" fill="#30352f" font-size="11">수정 여부를 확인하거나 직접 빌드.</text>
    <rect x="16" y="442" width="288" height="112" rx="9" fill="#f3e7e4"/><text x="28" y="468" fill="#a2645a" font-size="13" font-weight="700">PHP 5.4–7.3</text><text x="28" y="494" fill="#30352f" font-size="11">업스트림 지원 종료 브랜치.</text><text x="28" y="512" fill="#30352f" font-size="11">공급자의 수정판 또는 이전 여부를</text><text x="28" y="530" fill="#30352f" font-size="11">확인해야 합니다.</text>
    <rect x="16" y="568" width="288" height="92" rx="9" fill="#e5ebdb"/><text x="28" y="595" fill="#52643c" font-size="13" font-weight="700">버전 숫자만 보지 않기</text><text x="28" y="621" fill="#30352f" font-size="11">배포판 백포트는 수정되어도</text><text x="28" y="640" fill="#30352f" font-size="11">표시 버전이 같을 수 있습니다.</text>
  </g>
</svg>
