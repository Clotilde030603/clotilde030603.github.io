name: Deploy Dorami publication

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Immutable publication deployment UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dorami-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Mark deployment building
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: node scripts/update-deployment-status.mjs "$DEPLOYMENT_ID" building
      - name: Fetch one public publication manifest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: node scripts/fetch-public-manifest.mjs "$DEPLOYMENT_ID"
      - name: Verify and build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node scripts/verify-public-config.mjs
          npm run check
          npm run test
          npm run build
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload public artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Mark build failure
        if: failure()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: node scripts/update-deployment-status.mjs "$DEPLOYMENT_ID" failed
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment guard
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
      - name: Check this publication is still current
        id: current
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: node scripts/check-deployment-current.mjs "$DEPLOYMENT_ID"
      - name: Deploy Pages artifact
        if: steps.current.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Mark deployment live
        if: steps.current.outputs.current == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: node scripts/update-deployment-status.mjs "$DEPLOYMENT_ID" live
      - name: Mark deploy failure
        if: failure()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: node scripts/update-deployment-status.mjs "$DEPLOYMENT_ID" failed
