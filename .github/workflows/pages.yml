name: Deploy Dorami publication

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Immutable publication deployment UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dorami-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Mark deployment building
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: node scripts/update-deployment-status.mjs "$DEPLOYMENT_ID" building
      - name: Fetch one public publication manifest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: node scripts/fetch-public-manifest.mjs "$DEPLOYMENT_ID"
      - name: Verify and build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node scripts/verify-public-config.mjs
          npm run check
          npm run test
          npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Mark build failure
        if: failure()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: node scripts/update-deployment-status.mjs "$DEPLOYMENT_ID" failed
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment guard
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check this publication is still current
        id: current
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: node scripts/check-deployment-current.mjs "$DEPLOYMENT_ID"
      - name: Deploy Pages artifact
        if: steps.current.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Mark deployment live
        if: steps.current.outputs.current == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: node scripts/update-deployment-status.mjs "$DEPLOYMENT_ID" live
      - name: Mark deploy failure
        if: failure()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BUILD_MANIFEST_TOKEN: ${{ secrets.BUILD_MANIFEST_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: node scripts/update-deployment-status.mjs "$DEPLOYMENT_ID" failed
