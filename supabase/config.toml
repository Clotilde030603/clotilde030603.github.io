project_id = "dorami-blog"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:4321"
additional_redirect_urls = ["http://127.0.0.1:4321/admin/"]
enable_signup = false

[functions.public-comments]
verify_jwt = false

[functions.record-view]
verify_jwt = false

[functions.admin-manifest]
verify_jwt = false

[functions.admin-backup]
verify_jwt = true

[functions.publish-dispatch]
verify_jwt = true

[functions.deployment-status]
verify_jwt = false

[functions.admin-media]
verify_jwt = true

[functions.import-remote-image]
verify_jwt = true

[functions.restore-publication]
verify_jwt = true
